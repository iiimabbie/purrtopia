services:
  discord-bot:
    build: .
    container_name: purrtopia-discord-bot
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GUILD_ID=${GUILD_ID:-}
      - BOT_OWNER_IDS=${BOT_OWNER_IDS:-}
      - BOT_ADMIN_IDS=${BOT_ADMIN_IDS:-}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-purrtopia}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_NAME=${DB_NAME:-purrtopia}
      # Gemini AI
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      # Keyword Trigger
      - KEYWORD_TRIGGERS=${KEYWORD_TRIGGERS:-}
      - CHANNEL_BUBBLE=${CHANNEL_BUBBLE:-}
      - CHANNEL_DAILY_TOWN=${CHANNEL_DAILY_TOWN:-}
      - CHANNEL_WEATHER=${CHANNEL_WEATHER:-}
      - CHANNEL_HELPER=${CHANNEL_HELPER:-}
      - KEYWORD_ENABLED_CHANNELS=${KEYWORD_ENABLED_CHANNELS:-}
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - prod
    # Alternatively, use env_file:
    # env_file:
    #   - .env

    # For development with hot reload, uncomment:
    # volumes:
    #   - .:/app
    # command: go run ./cmd/bot

  # Development version with hot reload using air
  discord-bot-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: purrtopia-discord-bot-dev
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GUILD_ID=${GUILD_ID:-}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-heartopia}
      - DB_PASSWORD=${DB_PASSWORD:-heartopia_secret}
      - DB_NAME=${DB_NAME:-purrtopia}
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - dev

  mysql:
    image: mysql:8.0
    container_name: purrtopia-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secret}
      - MYSQL_DATABASE=${DB_NAME:-purrtopia}
      - MYSQL_USER=${DB_USER:-purrtopia}
      - MYSQL_PASSWORD=${DB_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 自動備份服務（每天備份，保留 7 天）
  mysql-backup:
    image: databack/mysql-backup
    container_name: purrtopia-mysql-backup
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
    command: dump --server=mysql --user=${DB_USER:-purrtopia} --pass=${DB_PASSWORD:-changeme} --include=${DB_NAME:-purrtopia} --target=/db --frequency=1440 --begin=0300 --compression=gzip
    volumes:
      - ./backups:/db           # 備份到本機 ./backups 資料夾
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
