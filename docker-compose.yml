services:
  discord-bot:
    build: .
    container_name: purrtopia-discord-bot
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GUILD_IDS=${GUILD_IDS:-}
      - BOT_OWNER_IDS=${BOT_OWNER_IDS:-}
      - BOT_ADMIN_IDS=${BOT_ADMIN_IDS:-}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-heartopia}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_NAME=${DB_NAME:-heartopia}
      # Gemini AI
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_FALLBACK_ENDPOINT=${GEMINI_FALLBACK_ENDPOINT:-}
      - GEMINI_FALLBACK_API_KEY=${GEMINI_FALLBACK_API_KEY:-}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
    labels:
      - "glance.url=https://example.com/?folder=/app"
